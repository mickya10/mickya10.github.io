<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open in Lyrika</title>
<!--
  Shared song links.

  Reached only when Lyrika is NOT installed: Android App Links verification
  (see /.well-known/assetlinks.json) sends the link straight to the app when
  it is, and this page never loads.

  So the only job here is the Play Store. The song is still named for the
  handful of seconds this is visible, because "Open Bohemian Rhapsody" is a
  reason to install and a bare store page is not.
-->
<style>
  :root {
    --bg: #0b0b0f; --fg: #f4f4f5; --muted: #a1a1aa;
    --accent: #22d3ee; --accent-fg: #0b0b0f; --card: #17171d; --border: #27272f;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #fafafa; --fg: #18181b; --muted: #52525b;
      --accent: #0891b2; --accent-fg: #ffffff; --card: #ffffff; --border: #e4e4e7;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .card {
    width: 100%; max-width: 420px; background: var(--card);
    border: 1px solid var(--border); border-radius: 20px;
    padding: 32px 24px; text-align: center;
  }
  .note { font-size: 13px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  h1 { font-size: 24px; margin: 12px 0 4px; overflow-wrap: anywhere; }
  .artist { color: var(--muted); margin: 0 0 24px; overflow-wrap: anywhere; }
  .btn {
    display: inline-block; width: 100%; padding: 14px 20px; border-radius: 999px;
    background: var(--accent); color: var(--accent-fg);
    font-weight: 600; text-decoration: none;
  }
  .sub { margin-top: 16px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <p class="note">Shared with you</p>
    <h1 id="title">A song</h1>
    <p class="artist" id="artist"></p>
    <a class="btn" id="get" href="https://play.google.com/store/apps/details?id=com.masoft.lyrika">Get Lyrika</a>
    <p class="sub">Lyrics and translations, line by line.</p>
  </div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var title = (q.get("t") || "").trim();
  var artist = (q.get("a") || "").trim();

  // textContent, never innerHTML: these values come from the URL, so building
  // markup out of them would let a crafted link inject script into the page.
  if (title) document.getElementById("title").textContent = title;
  if (artist) document.getElementById("artist").textContent = artist;
  if (title) document.title = title + (artist ? " - " + artist : "");

  // The song is NOT carried into the store link. Play can pass a referrer
  // string through an install, but only to an app that reads it with the
  // Install Referrer library, and Lyrika does not - so adding one would look
  // like it worked and quietly drop the song. A new installer lands on the
  // app's home screen; the shared link works from their second tap onwards,
  // once the app is installed to receive it.
})();
</script>
</body>
</html>
