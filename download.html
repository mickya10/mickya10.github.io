<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyrika - Download</title>
    <style>
        body { background: #0a0b0f; color: #e8e8ec; font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .msg { text-align: center; }
        .msg h1 { font-size: 2rem; background: linear-gradient(135deg, #2dd4bf, #a855f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .msg p { color: #888; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="msg">
        <h1>Lyrika</h1>
        <p>Redirecting to Google Play...</p>
    </div>
    <script type="module">
        import { initializeFaro } from "https://cdn.jsdelivr.net/npm/@grafana/faro-web-sdk@2.2.4/+esm";

        const PLAY_URL = "https://play.google.com/store/apps/details?id=com.masoft.lyrika";
        const params = new URLSearchParams(window.location.search);
        const source = params.get("utm_source") || "direct";
        const medium = params.get("utm_medium") || "";
        const campaign = params.get("utm_campaign") || "";

        const faro = initializeFaro({
            url: "https://faro-collector-prod-eu-central-0.grafana.net/collect/765f7e7304e7903ee2a76f8ea0171c99",
            app: { name: "Lyrika-Web", version: "1.0.0" },
        });

        faro.api.pushEvent("download_click", {
            source,
            medium,
            campaign,
            referrer: document.referrer || "",
            screen: screen.width + "x" + screen.height,
        });

        // Redirect after brief delay to ensure event sends
        setTimeout(() => {
            const utm = new URLSearchParams();
            if (source !== "direct") utm.set("utm_source", source);
            if (medium) utm.set("utm_medium", medium);
            if (campaign) utm.set("utm_campaign", campaign);
            const utmStr = utm.toString();
            window.location.href = PLAY_URL + (utmStr ? "&" + utmStr : "");
        }, 500);
    </script>
</body>
</html>
