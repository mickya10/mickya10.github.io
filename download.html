<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyrika - Download</title>
    <style>
        body { background: #0a0b0f; color: #e8e8ec; font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .msg { text-align: center; padding: 24px; }
        .msg h1 { font-size: 2rem; background: linear-gradient(135deg, #2dd4bf, #a855f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .msg p { color: #888; margin-top: 8px; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #333; border-top-color: #2dd4bf; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn { display: inline-block; margin-top: 24px; background: linear-gradient(135deg, #2dd4bf, #a855f6); color: #0a0b0f; padding: 14px 32px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="msg">
        <h1>Lyrika</h1>
        <p id="status"><span class="spinner"></span>Redirecting to Google Play...</p>
        <a id="fallback" class="btn" style="display:none" href="https://play.google.com/store/apps/details?id=com.masoft.lyrika">Open Google Play</a>
    </div>
    <script>
        (async function() {
            // Faro collector (CORS-enabled) for Lyrika Installs app
            var FARO_URL = "https://faro-collector-prod-eu-central-0.grafana.net/collect/32b6bb54b1e3901e7ece472b5e31910f";
            var APP_NAME = "Lyrika Installs";
            var APP_VERSION = "2.1.1";
            var ENV = "production";
            var PACKAGE = "com.masoft.lyrika";
            var PLAY_WEB = "https://play.google.com/store/apps/details?id=" + PACKAGE;
            var params = new URLSearchParams(window.location.search);
            var source = params.get("utm_source") || "direct";
            var medium = params.get("utm_medium") || "";
            var campaign = params.get("utm_campaign") || "";
            var ua = navigator.userAgent || "";

            var utm = [];
            if (source !== "direct") utm.push("utm_source=" + source);
            if (medium) utm.push("utm_medium=" + medium);
            if (campaign) utm.push("utm_campaign=" + campaign);
            var playUrl = PLAY_WEB + (utm.length ? "&" + utm.join("&") : "");

            // ─── Environment detection ───

            var isMobile = /Mobile|Android|iPhone|iPad/i.test(ua);
            var isAndroid = /Android/i.test(ua);
            var isIOS = /iPhone|iPad|iPod/i.test(ua);

            // In iframe?
            var inIframe = "false";
            try { inIframe = (window.self !== window.top) ? "true" : "false"; } catch(e) { inIframe = "true"; /* cross-origin iframe throws */ }

            // In-app browser detection
            var inAppBrowser = "none";
            if (/FBAN|FBAV/i.test(ua)) inAppBrowser = "facebook";
            else if (/Instagram/i.test(ua)) inAppBrowser = "instagram";
            else if (/Twitter|X-Twitter/i.test(ua)) inAppBrowser = "twitter";
            else if (/TikTok/i.test(ua)) inAppBrowser = "tiktok";
            else if (/LinkedInApp/i.test(ua)) inAppBrowser = "linkedin";
            else if (/Pinterest/i.test(ua)) inAppBrowser = "pinterest";
            else if (/Snapchat/i.test(ua)) inAppBrowser = "snapchat";
            else if (/Line\//i.test(ua)) inAppBrowser = "line";
            else if (/WhatsApp/i.test(ua)) inAppBrowser = "whatsapp";
            else if (/Telegram/i.test(ua)) inAppBrowser = "telegram";
            else if (/Reddit/i.test(ua)) inAppBrowser = "reddit";
            else if (/Discord/i.test(ua)) inAppBrowser = "discord";
            else if (/Viber/i.test(ua)) inAppBrowser = "viber";
            else if (/WeChat|MicroMessenger/i.test(ua)) inAppBrowser = "wechat";
            else if (/Brave/i.test(ua)) inAppBrowser = "none"; // Brave is a real browser
            else if (/DuckDuckGo/i.test(ua)) inAppBrowser = "none";
            else if (/GSA\//i.test(ua)) inAppBrowser = "google_app";
            else if (/MiuiBrowser/i.test(ua)) inAppBrowser = "miui";
            else if (/SamsungBrowser/i.test(ua)) inAppBrowser = "samsung_browser";
            else if (/HuaweiBrowser/i.test(ua)) inAppBrowser = "huawei";
            else if (/OPR\//i.test(ua)) inAppBrowser = "none"; // Opera is a real browser
            else if (/UCBrowser/i.test(ua)) inAppBrowser = "uc_browser";
            else if (/YaBrowser/i.test(ua)) inAppBrowser = "yandex";
            else if (/Taboola/i.test(ua)) inAppBrowser = "taboola";
            // Check referrer for known ad placements
            var ref = document.referrer || "";
            if (inAppBrowser === "none" && /\bwv\b/.test(ua)) {
                if (/xiaomi-lockscreen|glance/i.test(ref)) inAppBrowser = "xiaomi_lockscreen";
                else if (/taboola/i.test(ref) || /taboola/i.test(source)) inAppBrowser = "taboola_webview";
                else if (/facebook\.com/i.test(ref)) inAppBrowser = "facebook";
                else if (/instagram\.com/i.test(ref)) inAppBrowser = "instagram";
                else if (/tiktok\.com/i.test(ref)) inAppBrowser = "tiktok";
                else if (/twitter\.com|x\.com/i.test(ref)) inAppBrowser = "twitter";
                else inAppBrowser = "webview_unknown";
            }

            // Bot detection
            var isBot = "false";
            if (/bot|crawl|spider|slurp|Baiduspider|facebookexternalhit|Twitterbot|LinkedInBot|Googlebot|bingbot|yandex|DuckDuckBot|Applebot|Pinterestbot|TelegramBot|WhatsApp/i.test(ua)) {
                isBot = "true";
            }

            // Browser detection
            var browserName = "unknown";
            if (/CriOS/i.test(ua)) browserName = "chrome-ios";
            else if (/Chrome/i.test(ua) && !/Edg/i.test(ua)) browserName = "chrome";
            else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) browserName = "safari";
            else if (/Firefox|FxiOS/i.test(ua)) browserName = "firefox";
            else if (/Edg/i.test(ua)) browserName = "edge";
            else if (/Opera|OPR/i.test(ua)) browserName = "opera";

            // Platform
            var platform = "desktop";
            if (isAndroid) platform = "android";
            else if (isIOS) platform = "ios";

            // Potential redirect issues
            var issues = [];
            if (inIframe === "true") issues.push("iframe");
            if (inAppBrowser !== "none") issues.push("in_app_" + inAppBrowser);
            if (!isAndroid) issues.push("not_android");
            if (isBot === "true") issues.push("bot");
            if (!navigator.cookieEnabled) issues.push("cookies_disabled");
            if (typeof window.open !== "function") issues.push("no_window_open");

            // Faro requires X-Faro-Session-Id header, which triggers CORS preflight.
            // Faro Cloud accepts the preflight, so fetch works and we can await the response.
            var SESSION_ID = Math.random().toString(36).substring(2, 14) + Math.random().toString(36).substring(2, 6);
            async function sendEvent(name, attrs) {
                var payload = {
                    events: [{
                        name: name,
                        domain: "browser",
                        attributes: attrs || {},
                        timestamp: new Date().toISOString()
                    }],
                    meta: {
                        app: { name: APP_NAME, version: APP_VERSION, environment: ENV },
                        session: { id: SESSION_ID },
                        browser: { name: ua.substring(0, 100) },
                        page: { url: window.location.href }
                    }
                };
                try {
                    await fetch(FARO_URL, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-Faro-Session-Id": SESSION_ID
                        },
                        body: JSON.stringify(payload),
                        keepalive: true,
                        signal: AbortSignal.timeout(3000)
                    });
                } catch(e) {}
            }

            // ─── Geo lookup (HTTPS only) ───
            var country = "unknown", city = "", geoService = "none";

            try {
                var geo = await fetch("https://ipapi.co/json/", { signal: AbortSignal.timeout(3000) });
                if (geo.ok) {
                    var d = await geo.json();
                    if (!d.error) { country = d.country_name || d.country_code || "unknown"; city = d.city || ""; geoService = "ipapi.co"; }
                }
            } catch(e) {}

            if (country === "unknown") {
                try {
                    var geo2 = await fetch("https://ipinfo.io/json", { signal: AbortSignal.timeout(3000) });
                    if (geo2.ok) { var d2 = await geo2.json(); country = d2.country || "unknown"; city = d2.city || ""; geoService = "ipinfo.io"; }
                } catch(e) {}
            }

            if (country === "unknown") issues.push("geo_failed");

            // ─── Build attributes ───
            var attrs = {
                source: source,
                medium: medium,
                campaign: campaign,
                referrer: document.referrer || "",
                device: isMobile ? "Mobile" : "Desktop",
                platform: platform,
                country: country,
                city: city,
                geo_service: geoService,
                user_agent: ua.substring(0, 250),
                in_iframe: inIframe,
                in_app_browser: inAppBrowser,
                is_bot: isBot,
                browser: browserName,
                issues: issues.length > 0 ? issues.join(",") : "none",
                issue_count: String(issues.length),
            };

            // ─── Track and wait for Faro to accept the event, then redirect ───
            await sendEvent("download_redirect", attrs);

            // Don't redirect bots
            if (isBot === "true") {
                document.getElementById("status").innerHTML = "Lyrika - Song Lyrics & Language Learning";
                return;
            }

            // Redirect to Play Store
            window.location.href = playUrl;

            // Fallback button after 4s
            setTimeout(function() {
                if (!document.hidden) {
                    sendEvent("redirect_button_shown", attrs);
                    var btn = document.getElementById("fallback");
                    btn.href = playUrl;
                    btn.style.display = "inline-block";
                    btn.addEventListener("click", function() { sendEvent("redirect_manual_click", attrs); });
                    document.getElementById("status").textContent = "Tap the button below to open Google Play";
                }
            }, 4000);
        })();
    </script>
</body>
</html>
