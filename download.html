<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyrika - Download</title>
    <style>
        body { background: #0a0b0f; color: #e8e8ec; font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .msg { text-align: center; }
        .msg h1 { font-size: 2rem; background: linear-gradient(135deg, #2dd4bf, #a855f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .msg p { color: #888; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="msg">
        <h1>Lyrika</h1>
        <p>Redirecting to Google Play...</p>
    </div>
    <script>
        (async function() {
            var FARO_URL = "https://faro-collector-prod-eu-central-0.grafana.net/collect/32b6bb54b1e3901e7ece472b5e31910f";
            var PLAY_URL = "https://play.google.com/store/apps/details?id=com.masoft.lyrika";

            var params = new URLSearchParams(window.location.search);
            var source = params.get("utm_source") || "direct";
            var medium = params.get("utm_medium") || "";
            var campaign = params.get("utm_campaign") || "";

            var payload = JSON.stringify({
                events: [{
                    name: "download_click",
                    timestamp: new Date().toISOString(),
                    attributes: {
                        source: source,
                        medium: medium,
                        campaign: campaign,
                        referrer: document.referrer || "",
                        screen: screen.width + "x" + screen.height,
                        language: navigator.language || ""
                    }
                }],
                meta: {
                    sdk: { name: "faro-web-sdk", version: "2.2.4" },
                    app: { name: "Lyrika Installs", version: "1.0.0", environment: "production" },
                    browser: {
                        name: navigator.userAgent,
                        os: navigator.platform,
                        mobile: /Mobile|Android/.test(navigator.userAgent)
                    },
                    page: {
                        url: window.location.href
                    }
                }
            });

            try {
                await fetch(FARO_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: payload
                });
            } catch (e) {
                // Redirect even if tracking fails
            }

            var utm = [];
            if (source !== "direct") utm.push("utm_source=" + source);
            if (medium) utm.push("utm_medium=" + medium);
            if (campaign) utm.push("utm_campaign=" + campaign);
            window.location.href = PLAY_URL + (utm.length ? "&" + utm.join("&") : "");
        })();
    </script>
</body>
</html>
