<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyrika - Download</title>
    <style>
        body { background: #0a0b0f; color: #e8e8ec; font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .msg { text-align: center; }
        .msg h1 { font-size: 2rem; background: linear-gradient(135deg, #2dd4bf, #a855f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .msg p { color: #888; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="msg">
        <h1>Lyrika</h1>
        <p>Redirecting to Google Play...</p>
    </div>
    <script src="https://unpkg.com/@grafana/faro-web-sdk@2.2.4/dist/bundle/faro-web-sdk.iife.js"></script>
    <script>
        (async function() {
            var PLAY_URL = "https://play.google.com/store/apps/details?id=com.masoft.lyrika";
            var params = new URLSearchParams(window.location.search);
            var source = params.get("utm_source") || "direct";
            var medium = params.get("utm_medium") || "";
            var campaign = params.get("utm_campaign") || "";
            var isMobile = /Mobile|Android|iPhone|iPad/.test(navigator.userAgent);

            // Detect country via free GeoIP
            var country = "unknown";
            var city = "";
            try {
                var geo = await fetch("https://ipapi.co/json/", { signal: AbortSignal.timeout(3000) });
                if (geo.ok) {
                    var data = await geo.json();
                    country = data.country_name || data.country_code || "unknown";
                    city = data.city || "";
                }
            } catch (e) {}

            var faro = window.GrafanaFaroWebSdk.initializeFaro({
                url: "https://faro-collector-prod-eu-central-0.grafana.net/collect/32b6bb54b1e3901e7ece472b5e31910f",
                app: {
                    name: "Lyrika Installs",
                    version: "1.0.0",
                    environment: "production",
                },
                instrumentations: window.GrafanaFaroWebSdk.getWebInstrumentations(),
            });

            faro.api.pushEvent("download_click", {
                source: source,
                medium: medium,
                campaign: campaign,
                referrer: document.referrer || "",
                screen: screen.width + "x" + screen.height,
                device: isMobile ? "Mobile" : "Desktop",
                country: country,
                city: city,
            });

            // Wait for event to send
            await new Promise(function(r) { setTimeout(r, 800); });

            var utm = [];
            if (source !== "direct") utm.push("utm_source=" + source);
            if (medium) utm.push("utm_medium=" + medium);
            if (campaign) utm.push("utm_campaign=" + campaign);
            window.location.href = PLAY_URL + (utm.length ? "&" + utm.join("&") : "");
        })();
    </script>
</body>
</html>
